name: Build & Publish Jetson Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Dockerfile.jetson
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
  workflow_dispatch:
    inputs:
      tag:
        description: "Override image tag (leave empty to use git-derived tag)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE: theodore-lheureux/ffed_protosat_rs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # v1.2.3 git tag → 1.2.3, 1.2, 1, latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # untagged main push → sha-a1b2c3d
            type=sha,prefix=sha-,format=short
            # manual override via workflow_dispatch input
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jetson
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Determine primary tag for deploy.env
        id: primary_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Update deploy.env with new tag
        run: |
          sed -i "s|^APP_IMAGE_TAG=.*|APP_IMAGE_TAG=${{ steps.primary_tag.outputs.value }}|" deploy.env

      - name: Commit updated deploy.env
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update APP_IMAGE_TAG to ${{ steps.primary_tag.outputs.value }}"
          file_pattern: deploy.env
